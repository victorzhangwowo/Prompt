name = "myprompt"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# 说明：
# 在 Cloudflare Pages 控制台部署时，请直接在 Settings -> Bindings 界面绑定：
#   1. KV Namespace: 变量名 PROMPTS_KV
#   2. R2 Bucket:    变量名 MEDIA_BUCKET
# （此处不写死占位符 id，避免 Cloudflare Pages 锁定控制台绑定或报 namespace not found）
